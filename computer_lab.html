<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Halls</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f0f0f0, #d9e3f0);
            text-align: center;
        }
        .content {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 20px;
        }
        img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        }
        p {
            font-size: 18px;
            color: #444;
            line-height: 1.8;
            margin-top: 15px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.15);
        }
        .btn:hover {
            background: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Computer Lab</h1>
        <img src="https://d23qowwaqkh3fj.cloudfront.net/wp-content/uploads/2024/03/Civil-computer-Lab.jpg" alt="Computer Lab">
        <p>Our computer labs are equipped with the latest technology and software to help students hone their technical skills.</p>
        <p>It provides high-speed internet access and printing services.</p>
        <a href="explore.html" class="btn">Back to Home</a>
    </div>
</body>
</html>
