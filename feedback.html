<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 50%;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
            margin: 10px 0;
            display: block;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="radio"], input[type="checkbox"] {
            margin-right: 10px;
        }
        .rating {
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>College Feedback Form</h2>
    <form action="submit_feedback.php" method="post">
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="course">Course Taken:</label>
        <input type="text" id="course" name="course" required>

        <label>How satisfied are you with the quality of the course?</label>
        <div class="rating">
            <input type="radio" id="excellent" name="quality" value="Excellent">
            <label for="excellent">Excellent</label>
            <input type="radio" id="good" name="quality" value="Good">
            <label for="good">Good</label>
            <input type="radio" id="average" name="quality" value="Average">
            <label for="average">Average</label>
            <input type="radio" id="poor" name="quality" value="Poor">
            <label for="poor">Poor</label>
        </div>

        <label for="feedback">Additional Feedback:</label>
        <textarea id="feedback" name="feedback" rows="4" placeholder="Your feedback here..."></textarea>

        <label for="improvements">What improvements would you suggest?</label>
        <textarea id="improvements" name="improvements" rows="4" placeholder="Suggestions here..."></textarea>

        <label for="newsletter">Would you like to receive updates about future courses?</label>
        <input type="checkbox" id="newsletter" name="newsletter" value="Yes">
        <label for="newsletter">Yes, keep me updated</label>

        <button type="submit">Submit Feedback</button>
    </form>
</div>

</body>
</html>
